        <line class="ln" x1="827" y1="110" x2="827" y2="126" marker-end="url(#diagram-architecture-a5)"></line>
        <polyline class="ln" points="432,149 620,149 620,114" marker-end="url(#diagram-architecture-a5)"></polyline>
        <polyline class="ln t" points="754,149 664,149 664,114" marker-end="url(#diagram-architecture-a5t)"></polyline>
        <text class="ns" x="658" y="165" fill="#0F6B60" text-anchor="end">verified outcome</text>

        <!-- LANE 2 -->
        <text class="lbl" x="170" y="212">LANE 2 · WATCH</text>
        <rect class="n" x="170" y="220" width="122" height="50" rx="3"></rect>
        <text class="nt sm" x="181" y="240">BlazeFace</text><text class="ns" x="181" y="255">face present?</text>
        <rect class="n" x="310" y="220" width="122" height="50" rx="3"></rect>
        <text class="nt sm" x="321" y="240">Motion energy</text><text class="ns" x="321" y="255">frame difference</text>
        <rect class="n" x="450" y="220" width="146" height="50" rx="3"></rect>
        <text class="nt sm" x="461" y="240">Scene describer</text><text class="ns" x="461" y="255">a closed form</text>
        <line class="ln" x1="292" y1="245" x2="308" y2="245" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="432" y1="245" x2="448" y2="245" marker-end="url(#diagram-architecture-a5)"></line>

        <!-- LANE 3 -->
        <text class="lbl" x="170" y="320">LANE 3 · READ → CHECK</text>
        <rect class="n" x="170" y="328" width="146" height="50" rx="3"></rect>
        <text class="nt sm" x="181" y="348">PP-OCRv4</text><text class="ns" x="181" y="363">det · angle · read</text>
        <rect class="n hi" x="334" y="328" width="146" height="50" rx="3"></rect>
        <text class="nt sm" x="345" y="348">Five staged agents</text><text class="ns" x="345" y="363">her own records</text>
        <rect class="n" x="498" y="328" width="146" height="50" rx="3"></rect>
        <text class="nt sm" x="509" y="348">Adjudicator</text><text class="ns" x="509" y="363">rules, no model</text>
        <line class="ln" x1="316" y1="353" x2="332" y2="353" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="480" y1="353" x2="496" y2="353" marker-end="url(#diagram-architecture-a5)"></line>

        <!-- LANE 4 -->
        <text class="lbl" x="170" y="428">LANE 4 · ASK</text>
        <rect class="n" x="170" y="436" width="122" height="50" rx="3"></rect>
        <text class="nt sm" x="181" y="456">Query router</text><text class="ns" x="181" y="471">7 guardrails</text>
        <rect class="n hi" x="310" y="436" width="134" height="50" rx="3"></rect>
        <text class="nt sm" x="321" y="456">BM25 retrieval</text><text class="ns" x="321" y="471">46 sourced docs</text>
        <rect class="n" x="462" y="436" width="134" height="50" rx="3"></rect>
        <text class="nt sm" x="473" y="456">Answer + source</text><text class="ns" x="473" y="471">shown verbatim</text>
        <rect class="n" x="614" y="436" width="134" height="50" rx="3"></rect>
        <text class="nt sm" x="625" y="456">Qwen 0.5B</text><text class="ns" x="625" y="471">shortens only</text>
        <line class="ln" x1="292" y1="461" x2="308" y2="461" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="444" y1="461" x2="460" y2="461" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="596" y1="461" x2="612" y2="461" marker-end="url(#diagram-architecture-a5)"></line>

        <!-- store -->
        <rect class="n st" x="170" y="500" width="412" height="44" rx="3"></rect>
        <text class="nt sm" x="181" y="519">Local database</text>
        <text class="ns" x="181" y="534">care log · health records · soother outcomes · cry episodes</text>
        <line class="ln" x1="231" y1="500" x2="231" y2="490" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="452" y1="500" x2="452" y2="382" marker-end="url(#diagram-architecture-a5)"></line>

        <!-- outputs -->
        <rect class="n out" x="1078" y="60"  width="156" height="50" rx="3"></rect>
        <text class="nt sm" x="1089" y="80">Phone alert</text><text class="ns" x="1089" y="95">names what it tried</text>
        <rect class="n out" x="1078" y="128" width="156" height="50" rx="3"></rect>
        <text class="nt sm" x="1089" y="148">Watch + band</text><text class="ns" x="1089" y="163">a pattern per severity</text>
        <rect class="n out" x="1078" y="220" width="156" height="50" rx="3"></rect>
        <text class="nt sm" x="1089" y="240">Safety alert</text><text class="ns" x="1089" y="255">posture · visibility</text>
        <rect class="n out" x="1078" y="328" width="156" height="50" rx="3"></rect>
        <text class="nt sm" x="1089" y="348">Safe / caution</text><text class="ns" x="1089" y="363">with its reasoning</text>
        <rect class="n out" x="1078" y="436" width="156" height="50" rx="3"></rect>
        <text class="nt sm" x="1089" y="456">The answer</text><text class="ns" x="1089" y="471">with its source</text>
        <rect class="n out" x="1078" y="500" width="156" height="44" rx="3"></rect>
        <text class="nt sm" x="1089" y="519">Second screen</text><text class="ns" x="1089" y="534">:8787 on the LAN</text>

