<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16.0 -16.0 1242.0 368.0" width="1242" height="368" role="img" aria-label="The audio pipeline, step by step"><style>
  .n{fill:#FFFFFF;stroke:#C0CBC6;stroke-width:1.1}
  .n.hi{fill:#E0F0EC;stroke:#0F6B60}
  .n.am{fill:#F8EEDA;stroke:#D8B972}
  .n.st{fill:#EBEFEC;stroke:#C0CBC6}
  .n.out{fill:#F6F8F6;stroke:#6A7873}
  .bx{fill:none;stroke:#0F6B60;stroke-width:1.4}
  .bx.dash{stroke:#6A7873;stroke-dasharray:6 4;stroke-width:1}
  .nt{fill:#0B1512;font-size:12.5px;font-weight:600;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .nt.sm{font-size:11.5px}
  .ns{fill:#6A7873;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .lbl{fill:#0F6B60;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;font-weight:600}
  .lbl.am{fill:#8A5E10}
  .lbl.gr{fill:#6A7873}
  .ax{fill:#6A7873;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{stroke:#C0CBC6;stroke-width:1.3;fill:none}
  .ln.t{stroke:#0F6B60;stroke-width:1.5}
  .ln.am{stroke:#8A5E10;stroke-dasharray:5 3}
  .axis{stroke:#C0CBC6;stroke-width:1}
  .tim{fill:#0F6B60;font-size:14px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style><rect x="-15.5" y="-15.5" width="1241.0" height="367.0" rx="6" fill="#F6F8F6" stroke="#C0CBC6"/>
        <defs><marker id="diagram-audio-a6" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><polygon points="0,0 10,4 0,8" fill="#C0CBC6"></polygon></marker>
        <marker id="diagram-audio-a6a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><polygon points="0,0 10,4 0,8" fill="#8A5E10"></polygon></marker></defs>

        <rect class="n am" x="745" y="6" width="290" height="34" rx="3"></rect>
        <text class="nt sm" x="757" y="21">Below −55 dBFS: stop here</text>
        <text class="ns" x="757" y="34">no inference runs — nearly every window, on a quiet night</text>

        <!-- row 1 -->
        <rect class="n" x="6" y="58" width="222" height="82" rx="3"></rect>
        <text class="lbl gr" x="18" y="76">STEP 01</text>
        <text class="nt sm" x="18" y="98">Capture</text>
        <text class="ns" x="18" y="113">16 kHz mono PCM16</text>
        <text class="ns" x="18" y="127">UNPROCESSED — no auto gain</text>

        <rect class="n" x="252" y="58" width="222" height="82" rx="3"></rect>
        <text class="lbl gr" x="264" y="76">STEP 02</text>
        <text class="nt sm" x="264" y="98">Ring buffer</text>
        <text class="ns" x="264" y="113">lock-free, so a slow frame</text>
        <text class="ns" x="264" y="127">never drops audio</text>

        <rect class="n" x="498" y="58" width="222" height="82" rx="3"></rect>
        <text class="lbl gr" x="510" y="76">STEP 03</text>
        <text class="nt sm" x="510" y="98">Window</text>
        <text class="ns" x="510" y="113">960 ms every 480 ms</text>
        <text class="ns" x="510" y="127">50% overlap · onsets survive</text>

        <rect class="n am" x="744" y="58" width="222" height="82" rx="3"></rect>
        <text class="lbl am" x="756" y="76">STEP 04</text>
        <text class="nt sm" x="756" y="98">Silence gate</text>
        <text class="ns" x="756" y="113">−55 dBFS threshold</text>
        <text class="ns" x="756" y="127">most of the battery story</text>

        <rect class="n" x="990" y="58" width="214" height="82" rx="3"></rect>
        <text class="lbl gr" x="1002" y="76">STEP 05</text>
        <text class="nt sm" x="1002" y="98">Log-mel</text>
        <text class="ns" x="1002" y="113">25 ms / 10 ms · 64 mels</text>
        <text class="ns" x="1002" y="127">125–7500 Hz · 96 × 64</text>

        <line class="ln" x1="228" y1="99" x2="250" y2="99" marker-end="url(#diagram-audio-a6)"></line>
        <line class="ln" x1="474" y1="99" x2="496" y2="99" marker-end="url(#diagram-audio-a6)"></line>
        <line class="ln" x1="720" y1="99" x2="742" y2="99" marker-end="url(#diagram-audio-a6)"></line>
        <line class="ln" x1="966" y1="99" x2="988" y2="99" marker-end="url(#diagram-audio-a6)"></line>
        <line class="ln am" x1="855" y1="58" x2="855" y2="42" marker-end="url(#diagram-audio-a6a)"></line>

        <!-- wrap -->
        <polyline class="ln" points="1204,140 1204,166 6,166 6,192" marker-end="url(#diagram-audio-a6)"></polyline>

        <!-- row 2 -->
        <rect class="n hi" x="6" y="192" width="222" height="82" rx="3"></rect>
        <text class="lbl" x="18" y="210">STEP 06</text>
        <text class="nt sm" x="18" y="232">The detector</text>
        <text class="ns" x="18" y="247">separable CNN · 21,218 params</text>
        <text class="ns" x="18" y="261">38 KB quantised · 0.2 ms</text>

        <rect class="n" x="252" y="192" width="222" height="82" rx="3"></rect>
        <text class="lbl gr" x="264" y="210">STEP 07</text>
        <text class="nt sm" x="264" y="232">Hysteresis</text>
        <text class="ns" x="264" y="247">3 of 5 ≥ 0.62 to enter</text>
        <text class="ns" x="264" y="261">6 in a row &lt; 0.42 to leave</text>

        <rect class="n" x="498" y="192" width="222" height="82" rx="3"></rect>
        <text class="lbl gr" x="510" y="210">STEP 08</text>
        <text class="nt sm" x="510" y="232">Episode</text>
        <text class="ns" x="510" y="247">duration · peak dBFS</text>
        <text class="ns" x="510" y="261">1 Hz envelope · trend</text>

        <rect class="n" x="744" y="192" width="222" height="82" rx="3"></rect>
        <text class="lbl gr" x="756" y="210">STEP 09</text>
        <text class="nt sm" x="756" y="232">Features → cause</text>
        <text class="ns" x="756" y="247">456 features from the same</text>
        <text class="ns" x="756" y="261">frontend · 500 trees walked</text>

        <rect class="n hi" x="990" y="192" width="214" height="82" rx="3"></rect>
        <text class="lbl" x="1002" y="210">STEP 10</text>
        <text class="nt sm" x="1002" y="232">Escalation ladder</text>
        <text class="ns" x="1002" y="247">log · play · verify · alert</text>
        <text class="ns" x="1002" y="261">and the loop on slide 05</text>

        <line class="ln" x1="228" y1="233" x2="250" y2="233" marker-end="url(#diagram-audio-a6)"></line>
        <line class="ln" x1="474" y1="233" x2="496" y2="233" marker-end="url(#diagram-audio-a6)"></line>
        <line class="ln" x1="720" y1="233" x2="742" y2="233" marker-end="url(#diagram-audio-a6)"></line>
        <line class="ln" x1="966" y1="233" x2="988" y2="233" marker-end="url(#diagram-audio-a6)"></line>

        <line class="axis" x1="6" y1="298" x2="1204" y2="298"></line>
        <text class="ns" x="6" y="318">Why no auto gain control: it flattens the loudness envelope, and the envelope is exactly what the ladder reads to decide whether a sound helped.</text>
        <text class="ns" x="6" y="332">Why 50% overlap: a cry starting mid-window would otherwise be split across two patches and score weakly in both — that onset is what matters most.</text>
      </svg>
