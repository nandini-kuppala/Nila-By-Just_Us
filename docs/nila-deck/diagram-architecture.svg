  .n.am{fill:#F8EEDA;stroke:#D8B972}
  .n.st{fill:#EBEFEC;stroke:#C0CBC6}
  .n.out{fill:#F6F8F6;stroke:#6A7873}
  .bx{fill:none;stroke:#0F6B60;stroke-width:1.4}
  .bx.dash{stroke:#6A7873;stroke-dasharray:6 4;stroke-width:1}
  .nt{fill:#0B1512;font-size:12.5px;font-weight:600;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .nt.sm{font-size:11.5px}
  .ns{fill:#6A7873;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .lbl{fill:#0F6B60;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;font-weight:600}
  .lbl.am{fill:#8A5E10}
  .lbl.gr{fill:#6A7873}
  .ax{fill:#6A7873;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{stroke:#C0CBC6;stroke-width:1.3;fill:none}
  .ln.t{stroke:#0F6B60;stroke-width:1.5}
  .ln.am{stroke:#8A5E10;stroke-dasharray:5 3}
  .axis{stroke:#C0CBC6;stroke-width:1}
  .tim{fill:#0F6B60;font-size:14px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style><rect x="-15.5" y="-15.5" width="1271.0" height="591.0" rx="6" fill="#F6F8F6" stroke="#C0CBC6"/>
        <defs>
          <marker id="diagram-architecture-a5"  viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><polygon points="0,0 10,4 0,8" fill="#C0CBC6"></polygon></marker>
          <marker id="diagram-architecture-a5t" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><polygon points="0,0 10,4 0,8" fill="#0F6B60"></polygon></marker>
        </defs>

        <rect class="bx" x="146" y="8" width="912" height="544" rx="8"></rect>
        <text class="lbl" x="162" y="28">ON THIS PHONE — NO REQUEST EVER LEAVES THIS BOX</text>

        <!-- inputs -->
        <rect class="n st" x="6" y="62"  width="126" height="46" rx="3"></rect>
        <text class="nt sm" x="17" y="82">Microphone</text><text class="ns" x="17" y="96">16 kHz mono</text>
        <rect class="n st" x="6" y="222" width="126" height="46" rx="3"></rect>
        <text class="nt sm" x="17" y="242">Camera</text><text class="ns" x="17" y="256">~5 fps</text>
        <rect class="n st" x="6" y="330" width="126" height="46" rx="3"></rect>
        <text class="nt sm" x="17" y="350">A photograph</text><text class="ns" x="17" y="364">strip or report</text>
        <rect class="n st" x="6" y="484" width="126" height="46" rx="3"></rect>
        <text class="nt sm" x="17" y="504">Quick log</text><text class="ns" x="17" y="518">tap or NFC</text>
        <line class="ln" x1="132" y1="85"  x2="168" y2="85"  marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="132" y1="245" x2="168" y2="245" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="132" y1="353" x2="168" y2="353" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="132" y1="507" x2="168" y2="507" marker-end="url(#diagram-architecture-a5)"></line>

        <!-- LANE 1 -->
        <text class="lbl" x="170" y="52">LANE 1 · LISTEN → SETTLE</text>
        <rect class="n" x="170" y="60" width="122" height="50" rx="3"></rect>
        <text class="nt sm" x="181" y="80">Log-mel</text><text class="ns" x="181" y="95">96 × 64 patch</text>
        <rect class="n hi" x="310" y="60" width="122" height="50" rx="3"></rect>
        <text class="nt sm" x="321" y="80">Cry detector</text><text class="ns" x="321" y="95">38 KB · 0.2 ms</text>
        <rect class="n" x="450" y="60" width="122" height="50" rx="3"></rect>
        <text class="nt sm" x="461" y="80">Hysteresis</text><text class="ns" x="461" y="95">3 of 5 · 6 out</text>
        <rect class="n hi" x="590" y="60" width="146" height="50" rx="3"></rect>
        <text class="nt sm" x="601" y="80">Escalation ladder</text><text class="ns" x="601" y="95">12 → 20 → 35 s</text>
        <rect class="n" x="754" y="60" width="146" height="50" rx="3"></rect>
        <text class="nt sm" x="765" y="80">Soothers + IR</text><text class="ns" x="765" y="95">your voice first</text>
        <rect class="n" x="310" y="128" width="122" height="42" rx="3"></rect>
        <text class="nt sm" x="321" y="147">Cause forest</text><text class="ns" x="321" y="161">500 trees</text>
        <rect class="n st" x="754" y="128" width="146" height="42" rx="3"></rect>
        <text class="nt sm" x="765" y="147">Outcome memory</text><text class="ns" x="765" y="161">per baby, per sound</text>
        <line class="ln" x1="292" y1="85" x2="308" y2="85" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="432" y1="85" x2="448" y2="85" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="572" y1="85" x2="588" y2="85" marker-end="url(#diagram-architecture-a5)"></line>
        <line class="ln" x1="736" y1="85" x2="752" y2="85" marker-end="url(#diagram-architecture-a5)"></line>
