lo,Consolas,monospace" font-size="11" fill="#0B1512" font-weight="500" text-anchor="start">2.3 s</text><text x="504.0" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6A7873" font-weight="400" text-anchor="start">log scale  ·  NNAPI to the NPU, then GPU, then CPU</text><line x1="22" y1="248" x2="938" y2="248" stroke="#D9E1DD"/><text x="22.0" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#6A7873" font-weight="400" text-anchor="start" letter-spacing="1">MEMORY WHILE MONITORING</text><text x="22.0" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0F6B60" font-weight="500" text-anchor="start">206 MB</text><text x="327.3333333333333" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#6A7873" font-weight="400" text-anchor="start" letter-spacing="1">ONE CPU CORE</text><text x="327.3333333333333" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0F6B60" font-weight="500" text-anchor="start">0.04%</text><text x="632.6666666666666" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#6A7873" font-weight="400" text-anchor="start" letter-spacing="1">NETWORK CALLS</text><text x="632.6666666666666" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0F6B60" font-weight="500" text-anchor="start">0</text><text x="22" y="314" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3B4A45" font-weight="400" text-anchor="start">Below -55 dBFS no inference runs at all. In a quiet nursery that is nearly every window, and it is most of why an eight-hour night fits inside one battery.</text></svg>
