<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16.0 -16.0 1272.0 592.0" width="1272" height="592" role="img" aria-label="Nila system architecture"><style>
  .n{fill:#FFFFFF;stroke:#C0CBC6;stroke-width:1.1}
